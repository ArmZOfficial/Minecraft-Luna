name: luma-portal
services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: luma
      POSTGRES_DB: luma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - luma_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luma -d luma"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  luma_postgres:
