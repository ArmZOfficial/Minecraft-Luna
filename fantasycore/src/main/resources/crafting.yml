      provider: core
      template: starter_runeblade
      version: 1
  moonstone_pickaxe:
    enabled: true
    version: 1
    name: อีเต้อจันทร์นักสำรวจ
    icon: IRON_PICKAXE
    daily-limit: 2
    gold-cost: 300
    inputs:
      IRON_INGOT: 16
      LAPIS_LAZULI: 8
      STICK: 4
    output:
      provider: core
      template: moonstone_pickaxe
      version: 1
  sentinel_chestplate:
    enabled: true
    version: 1
    name: เกราะผู้พิทักษ์ลูม่า
    icon: IRON_CHESTPLATE
