# Core v0.5: วัตถุดิบ vanilla ธรรมดา + gold.wallet → Core template หนึ่งชิ้นเข้า /mail
# ถ้าอัปเกรดเซิร์ฟเดิม ให้เพิ่ม template ใหม่ใน items.yml เอง (ปลั๊กอินไม่เขียนทับไฟล์เดิม)
# แก้สูตร/ราคาให้เพิ่ม recipe version; output.version ต้องตรง template version
enabled: true
recipes:
  starter_runeblade:
    enabled: true
    version: 1
    name: ดาบรูนผู้เริ่มต้น
    icon: IRON_SWORD
    daily-limit: 3
    gold-cost: 200
    inputs:
      IRON_INGOT: 12
      LAPIS_LAZULI: 4
      STICK: 2
