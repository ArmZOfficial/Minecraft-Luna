name: FantasyCore build

on:
  push:
    paths:
      - "fantasycore/**"
      - ".github/workflows/fantasycore.yml"
  pull_request:
    paths:
      - "fantasycore/**"
      - ".github/workflows/fantasycore.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fantasycore
    steps:
      - uses: actions/checkout@v4

      - name: Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build + unit tests
        run: ./gradlew build --no-daemon

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: FantasyCore
          path: fantasycore/build/libs/FantasyCore-*.jar
          if-no-files-found: error
